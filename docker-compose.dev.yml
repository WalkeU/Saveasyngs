services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      - PORT=3000
      - DB_PATH=/app/data/savings.db
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      - BACKEND_URL=http://backend:3000
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
