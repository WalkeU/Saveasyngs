services:
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      - PORT=3000
      - DB_PATH=/app/data/savings.db
      - ENABLE_LEGACY_CATEGORY_IMPORT=${ENABLE_LEGACY_CATEGORY_IMPORT:-false}
    volumes:
      - backend-prod-data:/app/data
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: docker/prod/caddy.Dockerfile
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-prod-data:
